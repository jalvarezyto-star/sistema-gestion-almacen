<div style="padding: 30px; max-width: 1000px; margin: 0 auto;">
  <h2 style="text-align: center; font-family: Roboto, sans-serif; margin-bottom: 30px;">
    Graficos
  </h2>

    <!-- grafico de barras -->
    <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
        <mat-card style="flex:1; min-width: 400px;">
            <mat-card-header>
                <mat-card-title>Stock por categoria</mat-card-title>
                <mat-card-subtitle> Volumen total de unidades</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content style="padding-top: 20px">
                <canvas #graficoBarras></canvas>
            </mat-card-content>
    </mat-card>

    <!-- Grafico Donas -->

        <mat-card style="flex:1; min-width: 300px; max-width: 400px; margin-top: 20px;">
            <mat-card-header>
                <mat-card-title>Estado del inventario</mat-card-title>
                <mat-card-subtitle> Productos criticos menores a 20</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content style="padding-top: 20px">
                <canvas #graficoTorta></canvas>
            </mat-card-content>
    </mat-card>
    </div>

    <mat-card style="margin-top: 20px; width: 100%;">
        <mat-card-header>
            <mat-card-title>Tendencia en movimientos de almacen</mat-card-title>
            <mat-card-subtitle> Ingresos vs Salidas</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content style="padding-top: 20px">
            <canvas #graficoLineas style="max-height: 300px;"></canvas>
        </mat-card-content>
    </mat-card>
</div>
